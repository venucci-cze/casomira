name: Build Casomira EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write


jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Python (32-bit)
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        architecture: x86

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE
      run: |
        cd src
        pyinstaller casomira.py --onefile --name casomira --icon=icon.ico --collect-all customtkinter
        pyinstaller updater.py --onefile --name updater --icon=icon.ico

    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          src/dist/casomira.exe
          src/dist/updater.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
