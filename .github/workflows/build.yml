name: Build Casomira EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read


jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE
      run: |
        cd src
        pyinstaller casomira.py --onefile --name casomira

    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        files: src/dist/casomira.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
